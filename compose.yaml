name: the-mania
services:
  app:
    build:
      context: .
      target: ${DOCKER_TARGET:-runtime}
    init: true
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_PATH: /app/.data/arena.sqlite
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MANIA_TRUST_PROXY: ${MANIA_TRUST_PROXY:-false}
      MANIA_TRUSTED_PROXY_IPS: ${MANIA_TRUSTED_PROXY_IPS:-}
      EXAM_DATE: ${EXAM_DATE:-}
      EXAM_LABEL: ${EXAM_LABEL:-Basisprüfung}
      LECTURE_QA_PROVIDER: ${LECTURE_QA_PROVIDER:-local}
      QA_PYTHON: ${QA_PYTHON:-/opt/qa-venv/bin/python}
      QA_INDEX_MODEL: ${QA_INDEX_MODEL:-}
      QA_ANSWER_MODEL: ${QA_ANSWER_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      JUDGE0_URL: ${JUDGE0_URL:-}
      JUDGE0_JAVA_LANGUAGE_ID: ${JUDGE0_JAVA_LANGUAGE_ID:-}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      # ETH email verification. AUTH_REQUIRE_VERIFIED is deliberately not passed through: the guard stays on.
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-}
      AUTH_SMTP_HOST: ${AUTH_SMTP_HOST:-}
      AUTH_SMTP_PORT: ${AUTH_SMTP_PORT:-587}
      AUTH_SMTP_SECURE: ${AUTH_SMTP_SECURE:-}
      AUTH_SMTP_USER: ${AUTH_SMTP_USER:-}
      AUTH_SMTP_PASSWORD: ${AUTH_SMTP_PASSWORD:-}
      AUTH_SMTP_URL: ${AUTH_SMTP_URL:-}
      AUTH_MAIL_DOMAIN: ${AUTH_MAIL_DOMAIN:-student.ethz.ch}
      AUTH_CLIENT_IP_HEADER: ${AUTH_CLIENT_IP_HEADER:-}
      AUTH_REVERIFY_DAYS: ${AUTH_REVERIFY_DAYS:-180}
      # Bootstrap administrators (ETH usernames, comma separated). Everyone else is promoted from inside the app.
      AUTH_ADMINS: ${AUTH_ADMINS:-riordache}
      # Student-submitted material: stored on the persistent volume, outside anything served to browsers.
      UPLOADS_DIR: /app/.data/uploads
      UPLOAD_MAX_VIDEO_MB: ${UPLOAD_MAX_VIDEO_MB:-2000}
      UPLOAD_MAX_PDF_MB: ${UPLOAD_MAX_PDF_MB:-100}
      UPLOAD_MAX_TRANSCRIPT_MB: ${UPLOAD_MAX_TRANSCRIPT_MB:-5}
      UPLOAD_MAX_USER_DAY_MB: ${UPLOAD_MAX_USER_DAY_MB:-4000}
      UPLOAD_MAX_TOTAL_MB: ${UPLOAD_MAX_TOTAL_MB:-30000}
      UPLOAD_MAX_PENDING_PER_USER: ${UPLOAD_MAX_PENDING_PER_USER:-5}
      # Indexing of approved material (needs the Python image: DOCKER_TARGET=qa-runtime, plus OPENAI_API_KEY and QA_INDEX_MODEL).
      COURSES_DIR: /app/.data/courses
      INDEXING_ENABLED: ${INDEXING_ENABLED:-true}
      INDEXING_MAX_ATTEMPTS: ${INDEXING_MAX_ATTEMPTS:-3}
      INDEXING_MAX_PAID_RUNS: ${INDEXING_MAX_PAID_RUNS:-50}
      INDEXING_POLL_SECONDS: ${INDEXING_POLL_SECONDS:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mania-data:/app/.data
      - type: bind
        source: ${LECTURES_DIR:-./lectures}
        target: /app/lectures
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${QA_DATA_DIR:-./qa/data}
        target: /app/qa/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DEMO_MEDIA_DIR:-./video-pull-up/media}
        target: /app/video-pull-up/media
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 3.5
    mem_limit: 6g
    pids_limit: 256
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mania-data:
